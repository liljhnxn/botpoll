<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="botPollGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="16" fill="#090a0f"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- Glowing Ballot Box Graphic -->
  <g filter="url(#glow)">
    <!-- Ballot Slot Top -->
    <rect x="18" y="15" width="28" height="4" rx="2" fill="url(#botPollGrad)" />
    
    <!-- Ballot Paper Entering -->
    <path d="M24 10 L40 10 L40 22 L24 22 Z" fill="#ffffff" opacity="0.95" />
    <path d="M28 14 L36 14" stroke="#090a0f" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Voting Box Body -->
    <path d="M15 22 L49 22 L45 49 C44.5 51.5 42.5 53 40 53 L24 53 C21.5 53 19.5 51.5 19 49 Z" 
          fill="url(#botPollGrad)" />

    <!-- Checkmark on Ballot Box -->
    <path d="M27 37 L31 41 L39 31" 
          fill="none" 
          stroke="#090a0f" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
